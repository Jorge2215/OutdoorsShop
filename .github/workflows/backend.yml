# Status badge: ![Backend CI](https://github.com/Jorge2215/OutdoorsShop/actions/workflows/backend.yml/badge.svg)

name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore OutdoorsShop.slnx --runtime linux-x64

      - name: Build solution
        run: dotnet build OutdoorsShop.slnx --no-restore

      - name: Run tests
        run: dotnet test OutdoorsShop.slnx --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Report test summary
        if: always()
        run: |
          TRX=$(find TestResults -name "*.trx" | head -1)
          if [ -n "$TRX" ]; then
            PASSED=$(grep -oP 'passed="\K[0-9]+' "$TRX" | head -1 || echo "?")
            FAILED=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$TRX" | head -1 || echo "0")
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | Failed | Skipped |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| $PASSED | $FAILED | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Install EF Core CLI
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: dotnet tool install --global dotnet-ef --version 10.0.8

      - name: Build migration bundle
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ConnectionStrings__DefaultConnection: Server=tcp:placeholder.database.windows.net,1433;Initial Catalog=OutdoorsShop;User ID=placeholder;Password=Placeholder123!;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            --project src/OutdoorsShop.Infrastructure/OutdoorsShop.Infrastructure.csproj \
            --startup-project src/OutdoorsShop.Api/OutdoorsShop.Api.csproj \
            --configuration Release \
            --self-contained \
            --runtime linux-x64 \
            --output publish/efbundle

      - name: Upload migration bundle artifact
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: db-migration-bundle
          path: publish/efbundle

      - name: Publish API artifact
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: dotnet publish src/OutdoorsShop.Api/OutdoorsShop.Api.csproj --configuration Release -r linux-x64 --self-contained false /p:UseAppHost=false --output publish/api

      - name: Package API artifact
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cd publish/api
          zip -r ../api.zip .

      - name: Upload API publish artifact
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api.zip

  deploy:
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_WEBAPP_NAME: app-outdoors-api-dev
      AZURE_RESOURCE_GROUP: rg-outdoors-dev
      API_HEALTH_URL: https://app-outdoors-api-dev.azurewebsites.net/api/health
      AZURE_CLIENT_ID: c0fed59f-52ae-4a13-83e7-f89844c039a6
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}

    steps:
      - name: Download migration bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: db-migration-bundle
          path: publish

      - name: Download API publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish

      - name: Validate Azure deployment configuration
        shell: bash
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "### Backend deploy blocked by external Azure configuration" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and packaging passed, but deployment cannot authenticate to Azure." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required configuration value(s): ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure them in the repository or 'dev' GitHub environment, then rerun the backend workflow from main." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing Azure deployment configuration::Build and packaging succeeded, but deployment is blocked until ${missing[*]} are configured for the repository or 'dev' environment."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve live SQL connection string
        shell: bash
        run: |
          if [ -n "$AZURE_SQL_CONNECTION_STRING" ]; then
            echo "::add-mask::$AZURE_SQL_CONNECTION_STRING"
            echo "AZURE_SQL_CONNECTION_STRING=$AZURE_SQL_CONNECTION_STRING" >> "$GITHUB_ENV"
            exit 0
          fi

          raw_sql_connection=$(az webapp config appsettings list \
            --name "$AZURE_WEBAPP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='ConnectionStrings__DefaultConnection'].value | [0]" \
            -o tsv)

          if [ -z "$raw_sql_connection" ]; then
            echo "### Backend deploy blocked by live app configuration" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The only live environment is missing app setting ConnectionStrings__DefaultConnection." >> "$GITHUB_STEP_SUMMARY"
            echo "Restore that app setting on $AZURE_WEBAPP_NAME, then rerun the backend workflow from main." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing live SQL connection string::ConnectionStrings__DefaultConnection is not configured on $AZURE_WEBAPP_NAME."
            exit 1
          fi

          sql_connection="$raw_sql_connection"

          if [[ "$raw_sql_connection" == @Microsoft.KeyVault* ]]; then
            vault_name=$(printf '%s' "$raw_sql_connection" | sed -n "s/^@Microsoft\.KeyVault([^)]*VaultName=\([^;)]*\).*$/\1/p")
            secret_name=$(printf '%s' "$raw_sql_connection" | sed -n "s/^@Microsoft\.KeyVault([^)]*SecretName=\([^;)]*\).*$/\1/p")
            secret_version=$(printf '%s' "$raw_sql_connection" | sed -n "s/^@Microsoft\.KeyVault([^)]*SecretVersion=\([^;)]*\).*$/\1/p")

            if [ -z "$vault_name" ] || [ -z "$secret_name" ]; then
              echo "### Backend deploy blocked by Key Vault reference parsing" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "ConnectionStrings__DefaultConnection is a Key Vault reference, but VaultName/SecretName could not be parsed." >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=Invalid Key Vault reference::Could not parse VaultName/SecretName from ConnectionStrings__DefaultConnection."
              exit 1
            fi

            if [ -n "$secret_version" ]; then
              sql_connection=$(az keyvault secret show --vault-name "$vault_name" --name "$secret_name" --version "$secret_version" --query value -o tsv)
            else
              sql_connection=$(az keyvault secret show --vault-name "$vault_name" --name "$secret_name" --query value -o tsv)
            fi
          fi

          if [ -z "$sql_connection" ]; then
            echo "### Backend deploy blocked by SQL secret resolution" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The live SQL connection string could not be resolved from $AZURE_WEBAPP_NAME." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing resolved SQL connection string::Could not resolve a usable SQL connection string for migrations."
            exit 1
          fi

          echo "::add-mask::$sql_connection"
          echo "AZURE_SQL_CONNECTION_STRING=$sql_connection" >> "$GITHUB_ENV"

      - name: Apply EF Core migrations
        shell: bash
        run: |
          chmod +x publish/efbundle
          ./publish/efbundle --connection "$AZURE_SQL_CONNECTION_STRING"

      - name: Deploy API package
        run: az webapp deployment source config-zip --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --src publish/api.zip --timeout 600

      - name: Smoke test API health
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "$API_HEALTH_URL"
