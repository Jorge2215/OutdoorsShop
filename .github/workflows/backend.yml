# Status badge: ![Backend CI](https://github.com/Jorge2215/OutdoorsShop/actions/workflows/backend.yml/badge.svg)

name: Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore OutdoorsShop.slnx

      - name: Build solution
        run: dotnet build OutdoorsShop.slnx --no-restore

      - name: Run tests
        run: dotnet test OutdoorsShop.slnx --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx

      - name: Report test summary
        if: always()
        run: |
          TRX=$(find TestResults -name "*.trx" | head -1)
          if [ -n "$TRX" ]; then
            PASSED=$(grep -oP 'passed="\K[0-9]+' "$TRX" | head -1 || echo "?")
            FAILED=$(grep -oP 'failed="\K[0-9]+' "$TRX" | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$TRX" | head -1 || echo "0")
            echo "### Test Results" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | Failed | Skipped |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| $PASSED | $FAILED | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish API artifact
        if: github.event_name == 'push'
        run: dotnet publish src/OutdoorsShop.Api/OutdoorsShop.Api.csproj --configuration Release --no-restore -r linux-x64 --self-contained false /p:UseAppHost=false --output publish/api

      - name: Package API artifact
        if: github.event_name == 'push'
        run: |
          cd publish/api
          zip -r ../api.zip .

      - name: Upload API publish artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: publish/api.zip

  deploy:
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'dev')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      AZURE_WEBAPP_NAME: ${{ github.ref_name == 'main' && 'app-outdoors-api-prod' || 'app-outdoors-api-dev' }}
      AZURE_RESOURCE_GROUP: ${{ github.ref_name == 'main' && 'rg-outdoors-prod' || 'rg-outdoors-dev' }}
      API_HEALTH_URL: ${{ github.ref_name == 'main' && 'https://app-outdoors-api-prod.azurewebsites.net/api/health' || 'https://app-outdoors-api-dev.azurewebsites.net/api/health' }}

    steps:
      - name: Download API publish artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: publish

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API package
        run: az webapp deployment source config-zip --name "$AZURE_WEBAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --src publish/api.zip --timeout 600

      - name: Smoke test API health
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 "$API_HEALTH_URL"
