# Status badge: ![Functions CI/CD](https://github.com/Jorge2215/OutdoorsShop/actions/workflows/functions.yml/badge.svg)

name: Functions CI/CD

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'src/OutdoorsShop.Functions/**'
      - '.github/workflows/functions.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/OutdoorsShop.Functions/**'
      - '.github/workflows/functions.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore src/OutdoorsShop.Functions/OutdoorsShop.Functions.csproj

      - name: Build Functions project
        run: dotnet build src/OutdoorsShop.Functions/OutdoorsShop.Functions.csproj --configuration Release --no-restore

      - name: Run Functions tests
        run: dotnet test tests/OutdoorsShop.Functions.Tests/OutdoorsShop.Functions.Tests.csproj --configuration Release --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-test-results
          path: TestResults/*.trx

      - name: Publish Functions artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: dotnet publish src/OutdoorsShop.Functions/OutdoorsShop.Functions.csproj --configuration Release -r linux-x64 --self-contained false /p:UseAppHost=false --output publish/functions

      - name: Package Functions artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: |
          cd publish/functions
          zip -r ../functions.zip .

      - name: Upload Functions publish artifact
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: functions-publish
          path: publish/functions.zip

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: prod
    env:
      AZURE_FUNCTIONAPP_NAME: func-outdoors-dev
      AZURE_RESOURCE_GROUP: rg-outdoors-dev
      AZURE_CLIENT_ID: c0fed59f-52ae-4a13-83e7-f89844c039a6
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Download Functions publish artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-publish
          path: publish

      - name: Validate Azure deployment configuration
        shell: bash
        run: |
          missing=()
          [ -n "$AZURE_CLIENT_ID" ] || missing+=("AZURE_CLIENT_ID")
          [ -n "$AZURE_TENANT_ID" ] || missing+=("AZURE_TENANT_ID")
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "### Functions deploy blocked by external Azure configuration" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Build and publish passed, but deployment cannot authenticate to Azure." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing required configuration value(s): ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "Configure them in the 'prod' GitHub environment or as repository secrets, then rerun the push." >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Missing Azure deployment configuration::Build and publish succeeded, but deployment is blocked until ${missing[*]} are configured for the 'prod' environment or repository."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Functions package
        run: az functionapp deployment source config-zip --name "$AZURE_FUNCTIONAPP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --src publish/functions.zip --timeout 600
